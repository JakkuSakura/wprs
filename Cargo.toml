[package]
name = "wprs"
version = "0.1.0"
authors = ["Nicolas Avrutin <rasputin@google.com>"]
license = "Apache-2.0"
edition = "2024"
build = "build.rs"

[profile.release-with-symbols]
inherits = "release"
debug = true

[profile.release-lto]
inherits = "release-with-symbols"
lto = true
codegen-units = 1

[profile.bench]
inherits = "release-lto"

[dependencies]
anyhow = "1.0.99"
bimap = "0.6.3"
bytemuck = { version = "1.23.2", features = ["extern_crate_alloc"] }
bytes = { version = "1.10.1", optional = true }
calloop = { version = "0.14.3", features = ["signals"] }
clap = { version = "4.5.53", features = ["derive"] }
crossbeam-channel = "0.5.15"
divbuf = "0.4.1"
enum-as-inner = "0.6.1"
async-trait = { version = "0.1.89", optional = true }
fallible-iterator = "0.3.0"
home = "0.5.11"
itertools = "0.14.0"
lagoon = { version = "0.1.3", features = ["scope"] }
nix = { version = "0.30.1", features = ["fs", "socket", "mman"] }
num_enum = "0.7.4"
rkyv = { version = "0.8.11" }
ron = "0.11.0"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.143"
smithay = { version = "0.7", default-features = false, features = [
    "desktop",
    "wayland_frontend"
], optional = true }
smithay-client-toolkit = { version = "0.20", optional = true }
static_assertions = "1.1.0"
sysctl = "0.6.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["parking_lot"] }
tracing-tracy = { version = "0.11.4", optional = true, features = [
    "only-localhost",
    "ondemand",
] }
tracy-client = { version = "0.18.2", optional = true, features = [
    "only-localhost",
    "ondemand",
] }
#winit = { path = "../winit/winit", optional = true }
winit = { git = "https://github.com/JakkuSakura/winit", branch = "customize-titlebar", optional = true }
wgpu = { version = "25.0.2", optional = true }
pollster = { version = "0.4.0", optional = true }
whoami = "1.6.1"
x11rb = { version = "0.13.2", features = ["shm"] }
zstd = { version = "0.13.3" }
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", branch = "master", optional = true }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", branch = "master", optional = true, features = ["reqwest-rustls-ring"] }
base64 = "0.22.1"
png = "0.18.0"
termwiz = "0.23.3"
ffmpeg-next = { version = "6.1", optional = true }

[build-dependencies]
merkle_hash = "3.8.0"

[patch.crates-io]
sspi = { git = "https://github.com/Devolutions/sspi-rs", branch = "master" }

[features]
# Ensure `wprsc` can run out-of-the-box on non-Wayland platforms.
default = ["winit-wgpu-client"]

# By default, avoid pulling in platform-specific Wayland compositor/client code.
# Enable the components you need explicitly.

# Build and enable the Wayland compositor backend (Smithay).
#
# Note: `wprsd` is the server binary regardless of backend; this feature only
# controls whether the Wayland compositor backend is compiled in.
wayland = ["dep:smithay"]

xwayland = ["wayland", "smithay/xwayland"]

# Backwards-compatible alias.
server = ["wayland"]

# Build and enable the Wayland client backend for `wprsc` (SCTK-based).
wayland-client = ["dep:smithay", "dep:smithay-client-toolkit"]

# --- Smithay feature bundles (for review/selection) ---
#
# These are convenience feature sets that map to upstream `smithay/*` features.
# Smithay uses "backend" to mean the compositor platform integration (drm/x11/winit/...) and
# "renderer" to mean how pixels are produced (GL/pixman/multi).
#
# Notes:
# - Most of these are Linux-oriented. Enabling DRM/GBM/libinput/udev/libseat on non-Linux targets
#   will likely fail to build.
# - `backend_winit` is a nested compositor backend; it is typically used for dev/testing and still
#   requires GL/EGL plumbing in Smithay.

# Minimal smithay compositor plumbing (Wayland server protocol + desktop helpers).
smithay_wayland_frontend = ["dep:smithay", "smithay/wayland_frontend", "smithay/desktop"]

# Nested compositor inside a winit window (dev-friendly).
smithay_winit_gl_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_winit",
    "smithay/renderer_gl",
]

smithay_winit_glow_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_winit",
    "smithay/renderer_glow",
]

# Nested compositor inside an X11 window.
smithay_x11_gl_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_x11",
    "smithay/renderer_gl",
]

smithay_x11_glow_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_x11",
    "smithay/renderer_glow",
]

# Linux DRM/KMS compositor bundles.
smithay_drm_gbm_egl_gl_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_egl",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "smithay/renderer_gl",
]

smithay_drm_gbm_egl_glow_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_egl",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "smithay/renderer_glow",
]

smithay_drm_pixman_wayland = [
    "smithay_wayland_frontend",
    "smithay/backend_drm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "smithay/renderer_pixman",
]

smithay_drm_multi_gpu_wayland = [
    "smithay_drm_gbm_egl_gl_wayland",
    "smithay/renderer_multi",
]

# XWayland integration (Linux; requires `wayland_frontend`).
smithay_xwayland = ["smithay_wayland_frontend", "smithay/xwayland"]

# Vulkan plumbing in Smithay (not a drop-in wgpu renderer).
smithay_vulkan_support = ["dep:smithay", "smithay/backend_vulkan"]

# Enables Smithay's full default feature set (heavy; mostly Linux).
smithay_default_all = ["dep:smithay", "smithay/default"]

# Curated "everything we might want on Linux" bundle without relying on smithay's own `default`.
# This is useful if you want to toggle a broad set of backends/renderers while still being explicit
# about what you pull in.
smithay_all_linux = [
    "smithay_drm_gbm_egl_gl_wayland",
    "smithay_drm_pixman_wayland",
    "smithay_drm_multi_gpu_wayland",
    "smithay_x11_gl_wayland",
    "smithay_winit_gl_wayland",
    "smithay_xwayland",
    "smithay_vulkan_support",
]

# NOTE: The Linux DRM/libinput/libseat bundles above require system packages discoverable via
# `pkg-config` (e.g. `libseat`, `libinput`, `libudev`, `libdrm`, `libgbm`, `EGL`).
# If you see a build failure like "`libseat.pc` not found", install the corresponding -dev packages
# (or avoid enabling the DRM/session features on that machine).

# Enables exporting data to the Tracy profiler.
# NOTE: opens a port on localhost.
# NOTE: breaks client reconnection due to sigpipe handling.
tracy = ["dep:tracy-client", "dep:tracing-tracy"]
# Enables memory allocation tracking for tracy. NOTE: severely decreases
# allocation performance.
tracy-allocator = ["tracy"]

# Enables a cross-platform client fallback that can run without a Wayland compositor.
winit-wgpu-client = ["dep:winit", "dep:wgpu", "dep:pollster"]
video-h264 = ["dep:ffmpeg-next"]

# Enables RDP protocol translation (wprs-rdp-bridge and optional wprsd integration).
rdp = ["dep:ironrdp-server", "dep:ironrdp-tokio", "dep:bytes", "dep:async-trait"]

[[bin]]
name = "wprsd"

[[bin]]
name = "wprsc"

[[bin]]
name = "wprs-rdp-bridge"
required-features = ["rdp"]

[[bin]]
name = "wrun"

#[patch.crates-io]
#sspi = { path = "vendor/sspi" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
png = "0.18.0"
proptest = "1.7.0"
trybuild = "1.0.110"

# To run this benchmark, uncomment the block below and specify a directory of
# images:
# WPRS_BENCH_IMAGE_DIR=/path/to/images cargo bench --bench image_compression
#
# A recommended set of images is the screenshot_web directory from
# qoi_benchmark_suite.tar on https://qoiformat.org/benchmark/. screenshot_web
# was chosen because it is relatively representative of general application
# GUIs, the kind of applications wprs is likely to be used with.

[[bench]]
name = "image_compression"
harness = false

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "media_codecs"
harness = false
